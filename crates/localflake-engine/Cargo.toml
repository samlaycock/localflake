[package]
name = "localflake-engine"
version.workspace = true
edition.workspace = true
description = "DuckDB-backed storage and query execution with Snowflake semantics, for localflake"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Compile DuckDB from source. Without it, DuckDB's prebuilt shared library is
# linked: from DUCKDB_LIB_DIR, or downloaded for the pinned release.
default = ["bundled"]
bundled = ["duckdb/bundled", "duckdb/json"]

[dependencies]
localflake-sql.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
duckdb.workspace = true
flate2.workspace = true
aes.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
cfb-mode.workspace = true
ctr.workspace = true
ecb.workspace = true
md5.workspace = true
ofb.workspace = true
quick-xml.workspace = true
serde_json.workspace = true
sha2.workspace = true
stacker.workspace = true
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
flate2.workspace = true
