[package]
name = "localflake-server"
version.workspace = true
edition.workspace = true
description = "A local Snowflake emulator on DuckDB that speaks the official drivers' protocol, for offline development and testing"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "localflake"
path = "src/main.rs"

[features]
default = ["bundled"]
bundled = ["localflake-engine/bundled"]

[dependencies]
localflake-engine.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
