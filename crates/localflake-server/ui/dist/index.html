    <script>
      // Apply the saved (or the system's) theme before the first paint, so dark mode doesn't flash.
      try {
        let theme = localStorage.getItem("localflake.theme")
        // The previous UI saved it as JSON ("dark", with the quotes).
        if (theme && theme.startsWith('"')) {
          theme = JSON.parse(theme)
          localStorage.setItem("localflake.theme", theme)
        }
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch {
        // Storage can be blocked; the theme provider falls back to the system theme.
      }
    </script>
