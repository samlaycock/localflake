name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow dispatches CI on the release pull request's branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the cache even when a check fails, so the next run starts warm.
          cache-on-failure: true
      # Link DuckDB's prebuilt library (the release localflake-engine/build.rs
      # pins) instead of compiling it from source, which takes ~8 minutes.
      - name: Fetch DuckDB's prebuilt library
        run: |
          version=$(sed -n 's/^const DUCKDB_VERSION: &str = "\(.*\)";$/\1/p' crates/localflake-engine/build.rs)
          dir="$RUNNER_TEMP/libduckdb"
          mkdir -p "$dir"
          curl -fsSL "https://install.duckdb.org/$version/duckdb-shared-libs-linux-amd64.tar.gz" | tar -xz -C "$dir"
          {
            echo "DUCKDB_LIB_DIR=$dir"
            echo "DUCKDB_DOWNLOAD_LIB=0"
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$dir"
          } >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features
      - run: cargo build -p localflake-server --no-default-features

      # End-to-end tests with the official drivers, against target/debug/localflake.
      - uses: astral-sh/setup-uv@v6
      - name: Python driver
        working-directory: tests/python
        run: uv run pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/node/package-lock.json
      - name: Node.js driver
        working-directory: tests/node
        run: npm ci && npm test
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go/go.mod
          cache-dependency-path: tests/go/go.sum
      - name: Go driver
        working-directory: tests/go
        # -count=1: Go caches test results, but not by the server binary under test.
        run: go test -count=1 ./...

  docker:
    name: Docker build (no push)
    # Only release pull requests: the image is only published from them.
    if: github.ref_name == 'changeset-release/main' || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

  changeset:
    name: Changeset present
    # The release pull request consumes changesets rather than adding one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for a changeset
        run: |
          if ! npx changeset status --since="origin/${{ github.base_ref }}"; then
            echo "::error::This pull request needs a changeset. Run 'npm run changeset' (or 'npm run changeset -- --empty' for changes users won't notice)."
            exit 1
          fi
