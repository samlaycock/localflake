name: Release

# On every push to main:
# 1. changesets opens or updates the "chore: release" pull request, which turns
#    pending changesets into a version bump and CHANGELOG entry;
# 2. once that pull request is merged (main has a version without a tag), the
#    Docker image is built for each platform and published to GHCR, then the
#    commit is tagged v<version> and a GitHub release created from the changelog.
# The tag comes last, so a failed build is retried by re-running the workflow.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  changesets:
    name: Release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Open or update the release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an unreleased version
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ] || git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: changesets
    if: needs.changesets.outputs.release == 'true'
    strategy:
      matrix:
        include:
          # Native runners: building DuckDB under QEMU emulation takes hours.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=localflake
            org.opencontainers.image.description=A local Snowflake emulator on DuckDB
            org.opencontainers.image.version=${{ needs.changesets.outputs.version }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux/${{ matrix.arch }}
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish v${{ needs.changesets.outputs.version }}
    needs: [changesets, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.changesets.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changesets.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.changesets.outputs.version }},enable=${{ !startsWith(needs.changesets.outputs.version, '0.') }}
            type=raw,value=latest
      - name: Push the multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ needs.changesets.outputs.version }}
      - name: Create the GitHub release
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ needs.changesets.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
